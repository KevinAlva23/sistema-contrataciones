name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      SECRET_KEY: clave-de-integracion-continua-0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análisis estático (ruff)
        run: ruff check .
      - name: Tipos (mypy)
        run: mypy app
      - name: Seguridad del código (bandit)
        run: bandit -r app -c pyproject.toml
      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Pruebas
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-fund
      - name: Análisis estático (eslint)
        run: npm run lint
      - run: npm run build
      - name: Vulnerabilidades en dependencias
        run: npm audit --omit=dev --audit-level=high
