name: Análisis estático

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff bandit pip-audit
      - name: Estilo y errores (ruff)
        run: ruff check backend
      - name: Seguridad del código (bandit)
        run: bandit -r backend/main.py -ll
      - name: Dependencias vulnerables (pip-audit)
        run: pip-audit -r backend/requirements.txt
      - name: Pruebas (pytest)
        run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
        working-directory: frontend
      - name: Compilar (detecta errores de plantillas Vue)
        run: npm run build
        working-directory: frontend
      - name: Dependencias vulnerables
        run: npm audit --audit-level=high
        working-directory: frontend

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/analyze@v3
