name: contrataciones
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /data/contrataciones.db
    volumes:
      - datos:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped
    networks: [interna]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    networks: [interna]
volumes:
  datos: {}
networks:
  interna: {}
